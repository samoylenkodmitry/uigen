# Kaggle Notebook runtime.
#
# Kaggle layout:
#   /kaggle/working/   per-run writable, kept on Save & Run All
#   /kaggle/input/     read-only input datasets attached to the notebook
#
# The expected dataset slug is "uigen-data"; attach it via "Add data ->
# Your datasets" in the notebook UI.

name: kaggle

paths:
  repo_dir: /kaggle/working/uigen
  # Kaggle script kernels mount datasets at
  #   /kaggle/input/datasets/<owner>/<slug>/
  # (notebooks use the bare /kaggle/input/<slug>/ path).
  # The uploaded tarball auto-extracts into a directory named after the
  # archive — data_v7_16skin_completion/ sits inside that.
  data_dir: /kaggle/input/datasets/dmitriisamoilenko/uigen-data/uigen-data-v7-16skin
  runs_dir: /kaggle/working/runs
  cache_dir: /kaggle/working/cache

num_workers: 2
device: cuda
amp: true
