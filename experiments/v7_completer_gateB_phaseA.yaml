# Gate B curriculum — Phase A: vertical-slider emphasis.
#
# c48 from scratch. State_family mask only. BV at weight 8, other files
# at weight 1-2 (so they keep getting gradient — the BV-only probe
# proved that zeroing them out causes catastrophic regression of POSBAR/
# MONOSTER/PLAYPAUS).
#
# 30k steps. Phase B will resume from this phase's last.safetensors.

name: v7_completer_gateB_phaseA
trainer: train_v7_completer.py

out: "@runs/gateB_curriculum_phaseA"

data:
  state_families: configs/state_families_classic.yaml
  skin_sources: "@data/data_v7_16skin_completion"

args:
  state-families: configs/state_families_classic.yaml
  steps: 30000
  batch: 12
  within-file-replacement: "false"
  lr: 1.0e-3
  weight-decay: 1.0e-4
  base-channels: 48
  file-embedding-dim: 32
  skin-embedding-dim: 64
  sampling-mode: weighted
  file-sampling-weights: configs/v7_file_weights_gateB_phaseA.yaml
  file-sampling-weights-mode: replace
  sobel-weight: 0.25
  mask-provenance: 0.0
  mask-state-family: 1.0
  mask-random-rect: 0.0
  mask-whole-file: 0.0
  mask-passthrough: 0.0
  checkpoint-every: 5000
  snapshot-every: 10000
  progress-every: 200
  seed: 6

notes: |
  Phase A acceptance hint (we don't gate on this — it's a warmup that
  feeds Phase B):
    BV state_family mae << 0.02 by 30k
    No regression beyond mae ~0.10 on POSBAR/MONOSTER/PLAYPAUS
  Phase B picks up here, broadens to consolidate every file, then
  Phase C switches to mixed mask for the final gate test.
