# Gate B curriculum — Phase C: mixed-mode final.
#
# Resumes from Phase B's last.safetensors. Inherits Phase B's file
# weights but switches to the trainer's "mixed" mask distribution so
# the eval-mix acceptance metric (mae<0.015, hit5>0.90) is the target.
#
# Mix mode breakdown (raw input weights; normalization is automatic):
#   state_family  0.60   - keeps the gains from Phases A & B
#   random_rect   0.30   - the easy mode; helps eval-mix mae
#   provenance    0.10   - bridges to provenance-mask data when present
#   whole_file    0.00   - excluded (trivially solved, no signal)
#   passthrough   0.00   - excluded (input == target case)
#
# 40k more steps (cumulative 100k including Phases A and B).

name: v7_completer_gateB_phaseC
trainer: train_v7_completer.py

out: "@runs/v7_completer_gateB_phaseC"

data:
  state_families: configs/state_families_classic.yaml
  skin_sources: "@data/data_v7_16skin_completion"

args:
  state-families: configs/state_families_classic.yaml
  steps: 40000
  batch: 12
  within-file-replacement: "false"
  lr: 5.0e-4
  weight-decay: 1.0e-4
  base-channels: 48
  file-embedding-dim: 32
  skin-embedding-dim: 64
  sampling-mode: weighted
  file-sampling-weights: configs/v7_file_weights_gateB_phaseBC.yaml
  file-sampling-weights-mode: replace
  sobel-weight: 0.25
  mask-provenance: 0.10
  mask-state-family: 0.60
  mask-random-rect: 0.30
  mask-whole-file: 0.0
  mask-passthrough: 0.0
  checkpoint-every: 5000
  snapshot-every: 10000
  progress-every: 200
  resume-from: "@runs/v7_completer_gateB_phaseB/last.safetensors"
  seed: 8

notes: |
  Phase C acceptance (THE GATE):
    mixed supported_mae < 0.015
    mixed hit5          > 0.90
    state_family BV mae < 0.010, hit5 > 0.90 (don't regress BV)
    state_family POSBAR/MONOSTER/PLAYPAUS mae < 0.05 (don't regress strips)

  lr halved (1e-3 -> 5e-4) so the mixed-mode introduction doesn't
  blow away Phase B's state_family fit. If Phase C regresses BV,
  reduce provenance weight (0.10 -> 0.05) and increase state_family
  share (0.60 -> 0.70). If Phase C still doesn't reach mixed mae<0.015,
  the bottleneck is random_rect coverage — extend Phase C or add a
  Phase D with state_family=0.40/random_rect=0.50/provenance=0.10.
