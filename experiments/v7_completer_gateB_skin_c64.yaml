# V7 Phase 0 / Gate B-skin: c64 from-scratch with state_family-focused recipe.
#
# The c48 state_family-focused continuation moved the right targets
# (VOLUME hit5 0.34->0.50, BALANCE mae -33%, three of the worst skins
# -45 to -79% mae) then saturated at state_family mae 0.042 / hit5 0.779
# — exactly the user's pre-declared "capacity justified" threshold.
#
# c64 is from-scratch. The trainer's load_state_dict would fail on a
# c48->c64 partial load anyway (conv shape mismatch), but we make it
# explicit by omitting --resume-from. No warm-start.
#
# Recipe inherited from the state_family-focused continuation:
#   - mask weights:
#       provenance     0.50  (gets redistributed to 0 — no pool)
#       state_family   0.35  -> effective ~0.70 post-normalization
#       random_rect    0.15  -> effective ~0.30
#       whole_file     0.00
#       passthrough    0.00
#   - file weights: doubled BALANCE/VOLUME/POSBAR/PLAYPAUS, MONOSTER 10
#   - skin_embedding_dim=64
#   - file_embedding_dim=32
#   - sobel_weight=0.25
#   - within-file-replacement=false
#   - progress-every 200
#
# Capacity:
#   - base_channels: 48 -> 64
#
# `batch` is a placeholder (8); the c64 batchbench kernel will override
# via --batch on the CLI for sweeping, and the final training kernel
# will pin the chosen batch here.

name: v7_completer_gateB_skin_c64
trainer: train_v7_completer.py

out: "@runs/v7_completer_gateB_skin_c64"

data:
  state_families: configs/state_families_classic.yaml
  skin_sources: "@data/data_v7_16skin_completion"

args:
  state-families: configs/state_families_classic.yaml
  steps: 80000
  batch: 8
  within-file-replacement: "false"
  lr: 1.0e-3
  weight-decay: 1.0e-4
  base-channels: 64
  file-embedding-dim: 32
  skin-embedding-dim: 64
  sampling-mode: weighted
  file-sampling-weights: configs/v7_file_weights_state_family_focus.yaml
  sobel-weight: 0.25
  mask-provenance: 0.50
  mask-state-family: 0.35
  mask-random-rect: 0.15
  mask-whole-file: 0.0
  mask-passthrough: 0.0
  checkpoint-every: 5000
  snapshot-every: 10000
  progress-every: 200
  seed: 3

notes: |
  From-scratch c64. No --resume-from (would crash on shape mismatch
  anyway; explicit is better). Acceptance:
    mixed   supported_mae < 0.015
    mixed   hit5          > 0.90
    state_family must materially beat c48's 0.042 / 0.779.
  Specific things to watch:
    stuck skins: aguileramp_oldschool, a_halo_so_bright_it_bleeds
    strip files: BALANCE, VOLUME, POSBAR, PLAYPAUS, MONOSTER
  Do not panic on slow early steps before 20k; c64 from scratch needs
  to enter descent before comparing against c48 at the same step.
