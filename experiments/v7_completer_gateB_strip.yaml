# V7 Gate B-strip — focused state_family-only probe on the failing strip files.
#
# c64 from-scratch + state_family-focused recipe stalled state_family
# mae at ~0.043 / hit5 0.85 (c48: 0.042 / 0.78). Per-file breakdown:
#   POSBAR.bmp     mae 0.087  hit5 0.60
#   BALANCE.bmp    mae 0.083  hit5 0.68
#   MONOSTER.bmp   mae 0.075  hit5 0.64
#   PLAYPAUS.bmp   mae 0.069  hit5 0.69
#   VOLUME.bmp     mae 0.066  hit5 0.75
# So the bottleneck is not capacity — it is gradient budget being spent on
# easier files (random_rect, whole_file passthrough, the chrome files).
#
# This probe trains on the strip files only, state_family mask only, and
# asks: can the current completer solve the exact failing subset when
# trained directly on it?
#
#   yes -> Full Gate B needs curriculum scheduling / hard-mode oversampling
#          (phases: strip-state_family -> all-files-state_family -> mixed).
#   no  -> The state-family mask / target formulation for these files is
#          insufficient. Inspect target/pred/diff per strip file; consider
#          file-specific masks or losses.
#
# Same 14 skins as Gate B-skin. c48 is enough (c64 did not move the
# state_family wall). Batch 12 with within-file-replacement=false: each
# strip-file group has 14 items (one per skin), so a batch of 12 covers 12
# distinct skins per step without duplicates.

name: v7_completer_gateB_strip
trainer: train_v7_completer.py

out: "@runs/v7_completer_gateB_strip"

data:
  state_families: configs/state_families_classic.yaml
  skin_sources: "@data/data_v7_16skin_completion"

args:
  state-families: configs/state_families_classic.yaml
  steps: 40000
  batch: 12
  within-file-replacement: "false"
  lr: 1.0e-3
  weight-decay: 1.0e-4
  base-channels: 48
  file-embedding-dim: 32
  skin-embedding-dim: 64
  sampling-mode: weighted
  file-sampling-weights: configs/v7_file_weights_strip_only.yaml
  sobel-weight: 0.25
  mask-provenance: 0.0
  mask-state-family: 1.0
  mask-random-rect: 0.0
  mask-whole-file: 0.0
  mask-passthrough: 0.0
  checkpoint-every: 5000
  snapshot-every: 5000
  progress-every: 200
  seed: 4

notes: |
  state_family-only narrows the optimizer's attention to the exact eval
  mode that is stuck. Strip-only file weights narrow it further to the
  five files that own most of the remaining mae mass (BALANCE, VOLUME,
  POSBAR, PLAYPAUS, MONOSTER). CBUTTONS is included with weight 1 as a
  control — it is already easy under state_family eval, so its training
  loss should stay flat while the strip files descend (or fail to).

  Acceptance for this probe:
    strip-file state_family mae << 0.04 -> capacity OK, problem is recipe.
    strip-file state_family mae ~= 0.04 -> formulation issue, inspect
      target/pred/diff per file and per frame, consider file-specific masks.

  Telemetry: the trainer now prints per-mode / per-file / per-skin loss
  breakdowns every progress_every steps, so the live log shows which
  strip file and which skin is dragging the mean.
